name: Release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json to release (for example, 0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version and tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          package_version="$(node --input-type=module -e 'import packageJson from "./package.json" with { type: "json" }; process.stdout.write(packageJson.version)')"
          test "$RELEASE_VERSION" = "$package_version"
          if git ls-remote --exit-code --tags origin "refs/tags/v${RELEASE_VERSION}" >/dev/null; then
            echo "Tag v${RELEASE_VERSION} already exists." >&2
            exit 1
          fi

      - name: Check formatting
        run: pnpm format:check

      - name: Lint source code
        run: pnpm lint

      - name: Run unit and integration tests
        run: pnpm test

      - name: Test deployment helper
        run: pnpm test:deployment

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Build production bundle
        run: pnpm build

      - name: Test release package
        run: pnpm test:release

      - name: Create release assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          scripts/create-release-archive.sh --output-dir release --version "$RELEASE_VERSION"
          sha256sum --check release/*.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" release/*.tar.gz release/*.sha256 \
            --target "$GITHUB_SHA" \
            --title "aMule React UI v${RELEASE_VERSION}" \
            --generate-notes
