name: Release

"on":
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
      publish_docker:
        description: Publish the multi-platform image to Docker Hub
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    if: github.ref == 'refs/heads/main'
    outputs:
      release_version: ${{ steps.release_version.outputs.release_version }}
      amule_version: ${{ steps.amule_version.outputs.amule_version }}
      amule_commit: ${{ steps.amule_version.outputs.amule_commit }}
      source_revision: ${{ steps.release_commit.outputs.commit_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create release app token
        id: release_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.release_token.outputs.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Calculate next release version
        id: release_version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          release_version="$(node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";

            const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
            const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(packageJson.version);
            if (!match) throw new Error(`package.json version must be a stable semantic version, got ${packageJson.version}`);

            let [major, minor, patch] = match.slice(1).map(Number);
            if (process.env.BUMP === "major") [major, minor, patch] = [major + 1, 0, 0];
            else if (process.env.BUMP === "minor") [minor, patch] = [minor + 1, 0];
            else if (process.env.BUMP === "patch") patch += 1;
            else throw new Error(`unsupported version bump: ${process.env.BUMP}`);

            packageJson.version = `${major}.${minor}.${patch}`;
            writeFileSync("package.json", `${JSON.stringify(packageJson, null, 2)}\n`);
            process.stdout.write(packageJson.version);
          ')"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.release_version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${RELEASE_VERSION}" >/dev/null; then
            echo "Tag v${RELEASE_VERSION} already exists." >&2
            exit 1
          fi

      - name: Read bundled aMule version
        id: amule_version
        run: |
          set -euo pipefail
          source docker/amule-version.env
          [[ "$AMULE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AMULE_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]
          echo "amule_version=$AMULE_VERSION" >> "$GITHUB_OUTPUT"
          echo "amule_commit=$AMULE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: pnpm format:check

      - name: Lint source code
        run: pnpm lint

      - name: Run unit and integration tests
        run: pnpm test

      - name: Test deployment helper
        run: pnpm test:deployment

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Build production bundle
        run: pnpm build

      - name: Test release package
        run: pnpm test:release

      - name: Commit release version to main
        id: release_commit
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.release_version }}
        run: |
          git config user.name "${{ steps.release_token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.release_token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release v${RELEASE_VERSION}"
          git push origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create release assets
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.release_version }}
        run: |
          scripts/create-release-archive.sh --output-dir release --version "$RELEASE_VERSION"
          (cd release && sha256sum --check *.sha256)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.release_version }}
          RELEASE_COMMIT: ${{ steps.release_commit.outputs.commit_sha }}
        run: |
          gh release create "v${RELEASE_VERSION}" release/*.tar.gz release/*.sha256 \
            --target "$RELEASE_COMMIT" \
            --title "aMule React UI v${RELEASE_VERSION}" \
            --generate-notes

  docker-hub:
    name: Publish Docker Hub image
    needs: release
    if: inputs.publish_docker && vars.DOCKERHUB_IMAGE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.source_revision }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.release.outputs.release_version }}
            AMULE_VERSION=${{ needs.release.outputs.amule_version }}
            AMULE_COMMIT=${{ needs.release.outputs.amule_commit }}
            SOURCE_REVISION=${{ needs.release.outputs.source_revision }}
          tags: |
            docker.io/${{ vars.DOCKERHUB_IMAGE }}:${{ needs.release.outputs.release_version }}-amule-${{ needs.release.outputs.amule_version }}
            docker.io/${{ vars.DOCKERHUB_IMAGE }}:latest
