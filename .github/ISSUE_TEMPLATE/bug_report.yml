name: Bug report
description: Report a reproducible problem in the aMule React UI.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, API cookies, tokens, or personally identifying download data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: UI version or commit
      description: Include the deployed commit or development branch when known.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, aMule/amuleapi version, and whether this was LAN access.
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Sanitized console errors, screenshots, or recordings are helpful.
